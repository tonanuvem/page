<!DOCTYPE html>
<html>
  <head>
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <title>Frontend Web Server</title>
    <meta charset="utf-8">
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col s2">&nbsp;</div>
        <div class="col s12">
          <div class="card blue">
            <div class="card-content white-text">
              <div class="card-title">NOME ALUNO <br> Envio de mensagem utilizando Webhooks (Power Automate)</div>
            </div>
            <div class="card-content white">
              <table class="bordered">
                <tbody>
                  <tr>
                    <td>URL Webhook</td>
                    <td>
                      <div class="input-field col s12">
                        <textarea id="webhook" class="materialize-textarea"></textarea>
                        <label for="webhook">Inserir Webhook</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>Mensagem</td>
                    <td>
                      <div class="input-field col s12">
                        <textarea id="msgInput" class="materialize-textarea"></textarea>
                        <label for="msgInput">Digite uma mensagem</label>
                      </div>
                    </td>                  
                  </tr>
                  <tr>
                    <td>Usuario</td>
                    <td>
                      <div class="input-field col s12">
                        <textarea id="user" class="materialize-textarea">NOME ALUNO</textarea>
                        <label for="user">Digite seu nome</label>
                      </div>
                    </td>                       
                  </tr>
                  <tr>
                    <td>Icone <a href="https://www.iconfinder.com/search/icons?family=organic-1" target="_blank">(escolher)</a></td>
                    <td>
                      <div class="input-field col s12">
                        <textarea id="icone" class="materialize-textarea">https://cdn4.iconfinder.com/data/icons/pop-scenes/1000/workspace___work_from_home_laptop_computer_drink_beverage-1024.png</textarea>
                        <label for="icone">Escolha seu icone</label>
                      </div>
                    </td>  
                  </tr>
                  <tr>
                    <td>Clicar</td>
                    <td>
                      <a class="waves-effect waves-light btn" onclick="postMSG()">enviar</a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="card blue">
            <div class="card-content white-text">
              <div class="card-title">Resultado: </div>
            </div>
            <div class="card-content white">
              <div id="result">Aguardando envio...</div>
            </div>
          </div>
        </div>
        <div class="col s2">&nbsp;</div>
      </div>
    </div>
  </body>
</html>

<script type="text/javascript">
  function postMSG() {
    M.toast({html: 'Enviando...', classes: 'rounded'});
    
    var webhook = document.getElementById('webhook').value;
    var msg = document.getElementById('msgInput').value;
    var user = document.getElementById('user').value;
    var icone = document.getElementById('icone').value;
    var resultDiv = document.querySelector("#result");

    // Construção simples do MessageCard
    var card = {
      "@type": "MessageCard",
      "@context": "http://schema.org/extensions",
      "themeColor": "0072C6",
      "summary": "Nova Mensagem",
      "sections": [{
        "activityTitle": msg,
        "activitySubtitle": "Enviado por " + user + " via FIAP Page App",
        "activityImage": icone
      }]
    };

    // Requisição HTTP simples
    fetch(webhook, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(card)
    })
    .then(function(response) {
      if (response.ok) {
        resultDiv.innerHTML = '<b style="color: green;">Solicitação enviada com sucesso!</b>';
      } else {
        resultDiv.innerHTML = '<b style="color: red;">Erro no servidor. Status: ' + response.status + '</b>';
      }
    })
    .catch(function(error) {
      resultDiv.innerHTML = '<b style="color: red;">Erro de rede ou bloqueio de CORS. Tente usar uma extensão de navegador para desativar o CORS.</b>';
    });
  }
</script>
