<!DOCTYPE html>
<html>
  <head>
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <title>Frontend Web Server</title>
    <meta charset="utf-8">
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col s2">&nbsp;</div>
        <div class="col s12">
          <div class="card blue">
            <div class="card-content white-text">
              <div class="card-title">NOME ALUNO <br> Envio de mensagem utilizando Webhooks (Slack)</div>
            </div>
            <div class="card-content white">
              <table class="bordered">
                <tbody>
                  <tr>
                    <td>URL Webhook</td>
                    <td>
                      <div class="input-field col s12">
                        <textarea id="webhook" class="materialize-textarea"></textarea>
                        <label for="webhook">Inserir Webhook</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>Canal</td>
                    <td>
                      <div class="input-field col s12">
                        <textarea id="canal" class="materialize-textarea">#escolher</textarea>
                        <label for="canal">#Canal</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>Mensagem</td>
                    <td>
                      <div class="input-field col s12">
                        <textarea id="msgInput" class="materialize-textarea"></textarea>
                        <label for="msgInput">Digite uma mensagem</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>Usuario</td>
                    <td>
                      <div class="input-field col s12">
                        <textarea id="user" class="materialize-textarea">NOME ALUNO</textarea>
                        <label for="user">Digite seu nome</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>Icone <a href="https://www.webfx.com/tools/emoji-cheat-sheet/" target="_blank">(escolher)</a></td>
                    <td>
                      <div class="input-field col s12">
                        <textarea id="icone" class="materialize-textarea">:cloud:</textarea>
                        <label for="icone">Escolha seu icone</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>Clicar</td>
                    <td>
                      <a class="waves-effect waves-light btn" onclick="postMSG()">enviar</a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="card blue">
            <div class="card-content white-text">
              <div class="card-title">Resultado: </div>
            </div>
            <div class="card-content white">
              <div id="result">Aguardando envio...</div>
            </div>
          </div>
        </div>
        <div class="col s2">&nbsp;</div>
      </div>
    </div>
  </body>
</html>

<script type="text/javascript">
// Lê um campo do formulário. Retorna '' se a página não tiver esse campo.
  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

// Definir a função postMSG(), conferir Canal e Webhook:
  function postMSG() {
    M.toast({html: 'Enviando...', classes: 'rounded'});

    var webhook = val('webhook');
    var msg = val('msgInput');
    var user = val('user') || 'NOME ALUNO';
    var icone = val('icone');
    var canal = val('canal');
    var resultDiv = document.querySelector("#result"); // elemento HTML que vai receber o resultado

    if (!webhook || !msg) {
      resultDiv.innerHTML = '<b style="color: red;">Informe o Webhook e a Mensagem.</b>';
      return;
    }

    // Slack e Teams esperam formatos (e cabeçalhos) diferentes:
    var slack = webhook.indexOf('hooks.slack.com') !== -1;
    var opcoes;

    if (slack) {
      var payload = { "text": msg, "username": user };
      if (canal) { payload.channel = canal; }
      if (icone) { payload.icon_emoji = icone; }
      // Sem o header Content-Type: application/json o navegador não dispara
      // o preflight OPTIONS, que o Slack não responde.
      opcoes = {
        method: 'POST',
        body: JSON.stringify(payload)
      };
    } else {
      // Teams via Power Automate: MessageCard
      var secao = {
        "activityTitle": msg,
        "activitySubtitle": "Enviado por " + user + " via FIAP Page App"
      };
      if (icone) { secao.activityImage = icone; }
      var card = {
        "@type": "MessageCard",
        "@context": "http://schema.org/extensions",
        "themeColor": "0072C6",
        "summary": "Nova Mensagem",
        "sections": [secao]
      };
      opcoes = {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(card)
      };
    }

    // Requisição HTTP simples
    fetch(webhook, opcoes)
    .then(function(response) {
      if (response.ok) {
        resultDiv.innerHTML = '<b style="color: green;">Solicitação enviada com sucesso! (' + (slack ? 'Slack' : 'Teams') + ')</b>';
      } else {
        resultDiv.innerHTML = '<b style="color: red;">Erro no servidor. Status: ' + response.status + '</b>';
      }
    })
    .catch(function(error) {
      resultDiv.innerHTML = '<b style="color: red;">Erro de rede ou bloqueio de CORS (a mensagem ainda pode ter sido entregue): ' + error.message + '</b>';
    });
  }
</script>
