<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf8">
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
    body, html {
      height: 100%;
      margin: 0;
    }
      
    .bgimg-1, .bgimg-3 {
      position: relative;
      opacity: 0.65;
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover; -ms-background-size: cover;   -o-background-size: cover;   -moz-background-size: cover;   -webkit-background-size: cover;

    }
    .bgimg-1 {
      background-image: url("https://images.unsplash.com/photo-1529236183275-4fdcf2bc987e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1947&q=80");
      min-height: 100%;
    }

    /* O fundo fica numa camada propria, atras do conteudo: assim o veu branco
       clareia so a imagem e o card continua com opacidade cheia. */
    .bgimg-2 {
      position: relative;
      min-height: 100%;
    }

    .bgimg-2::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      background-image: linear-gradient(rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.18)), url("https://images.unsplash.com/photo-1612153018787-4899c6e056d7?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=870&q=80");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .bgimg-3 {
      background-image: url("https://images.unsplash.com/photo-1513755638256-fbef33c0ca1f?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=934&q=80");
      min-height: 400px;
    }

    /* Turn off parallax scrolling for tablets and phones */
    @media only screen and (max-device-width: 1024px) {
      .bgimg-1, .bgimg-3 {
        background-attachment: scroll;
      }
      .bgimg-2::before {
        position: absolute;
      }
    }  
    </style>
    <title>Frontend Web Server</title>
  </head>
  <body>
    <div class="bgimg-2">
      <div class="container">
        <div class="col s2">&nbsp;</div>
        <div class="col s12">
          <div class="card green darken-4">
            <div class="card-content white-text">
              <div class="card-title">NOME ALUNO <br>
                Envio de mensagem utilizando Webhooks (Slack ou Teams / Power Automate) <br><br>
                Versão desta Página = GREEN <br>
              </div>
            </div>
            <div class="card-content white">
              <table class="bordered">
                <tbody>
                  <tr>
                    <td>URL Webhook</td>
                    <td>
                      <div class="input-field col s12">
                        <textarea id="webhook" class="materialize-textarea"></textarea>
                        <label for="webhook">Inserir Webhook</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>Mensagem</td>
                    <td>
                      <div class="input-field col s12">
                        <textarea id="msgInput" class="materialize-textarea"></textarea>
                        <label for="msgInput">Digite uma mensagem</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>Clicar</td>
                    <td>
                      <a class="waves-effect waves-light btn" onclick="postMSG()">enviar</a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="card green darken-4">
            <div class="card-content white-text">
              <div class="card-title">Resultado: </div>
            </div>
            <div class="card-content white">
              <div id="result">Aguardando envio...</div>
            </div>
          </div>
        </div>
        <div class="col s2">&nbsp;</div>
      </div>
    </div>
  </body>
</html>

<script type="text/javascript">
// Lê um campo do formulário. Retorna '' se a página não tiver esse campo.
  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

// Definir a função postMSG(), conferir Canal e Webhook:
  function postMSG() {
    M.toast({html: 'Enviando...', classes: 'rounded'});

    var webhook = val('webhook');
    var msg = val('msgInput');
    var user = val('user') || 'NOME ALUNO';
    var icone = val('icone');
    var canal = val('canal');
    var resultDiv = document.querySelector("#result"); // elemento HTML que vai receber o resultado

    if (!webhook || !msg) {
      resultDiv.innerHTML = '<b style="color: red;">Informe o Webhook e a Mensagem.</b>';
      return;
    }

    // Slack e Teams esperam formatos (e cabeçalhos) diferentes:
    var slack = webhook.indexOf('hooks.slack.com') !== -1;
    var opcoes;

    if (slack) {
      var payload = { "text": msg, "username": user };
      if (canal) { payload.channel = canal; }
      if (icone) { payload.icon_emoji = icone; }
      // Sem o header Content-Type: application/json o navegador não dispara
      // o preflight OPTIONS, que o Slack não responde.
      opcoes = {
        method: 'POST',
        body: JSON.stringify(payload)
      };
    } else {
      // Teams via Power Automate: MessageCard
      var secao = {
        "activityTitle": msg,
        "activitySubtitle": "Enviado por " + user + " via FIAP Page App"
      };
      if (icone) { secao.activityImage = icone; }
      var card = {
        "@type": "MessageCard",
        "@context": "http://schema.org/extensions",
        "themeColor": "0072C6",
        "summary": "Nova Mensagem",
        "sections": [secao]
      };
      opcoes = {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(card)
      };
    }

    // Requisição HTTP simples
    fetch(webhook, opcoes)
    .then(function(response) {
      if (response.ok) {
        resultDiv.innerHTML = '<b style="color: green;">Solicitação enviada com sucesso! (' + (slack ? 'Slack' : 'Teams') + ')</b>';
      } else {
        resultDiv.innerHTML = '<b style="color: red;">Erro no servidor. Status: ' + response.status + '</b>';
      }
    })
    .catch(function(error) {
      resultDiv.innerHTML = '<b style="color: red;">Erro de rede ou bloqueio de CORS (a mensagem ainda pode ter sido entregue): ' + error.message + '</b>';
    });
  }
</script>
